# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
# Install the pinned audit tool directly with:
# cargo install cargo-deny --version 0.20.2 --locked
# Then run locally with: cargo deny check advisories

[graph]
# Audit the complete dependency graph in both local runs and CI, including
# optional features such as `lancedb`.
all-features = true

[advisories]
# Fail on any security advisory in the RustSec database.
version = 2
yanked = "warn"
ignore = [
    # --- Unmaintained transitive crates (informational, no safe upgrade) ---
    # Remove each once the upstream that pulls it migrates away.
    "RUSTSEC-2025-0141", # bincode — transitive
    "RUSTSEC-2022-0081", # json — gliner feature (json crate)
    "RUSTSEC-2025-0119", # number_prefix — via indicatif/progress bars
    "RUSTSEC-2024-0436", # paste — transitive proc-macro helper
    "RUSTSEC-2025-0134", # rustls-pemfile — transitive TLS stack
    # h2 0.3 is pulled by actix-web's hyper 0.14 stack and by hf-hub's
    # reqwest 0.11 stack. The advisory's fix is h2 0.4.16, which is not
    # semver-compatible with either upstream dependency. Review by 2027-03-01
    # and remove when actix-web and hf-hub expose h2 0.4-compatible releases.
    "RUSTSEC-2026-0258",
    # Leptos 0.8 and its proc-macro dependencies still require this
    # unmaintained crate; cargo-deny reports no safe upgrade. Review by
    # 2027-03-01.
    "RUSTSEC-2026-0173",
]

[licenses]
version = 2
# Allow the permissive licenses common across the Rust ecosystem.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",              # Boost Software License (permissive) — transitive dep
    "CDLA-Permissive-2.0",  # Mozilla CA-cert data bundle via webpki-roots (permissive)
    "0BSD",                 # BSD Zero Clause (OSI, permissive) — mock_instant via lancedb
]
confidence-threshold = 0.8

[bans]
# Warn (don't fail) on duplicate versions of the same crate.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
