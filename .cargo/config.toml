# Workspace builds intentionally use portable CPU instructions. For a local,
# host-specific benchmark only, opt in explicitly with:
#   RUSTFLAGS="-C target-cpu=native" cargo bench -p graphrag-core

# Configure getrandom to use wasm_js backend for WASM targets.
# These target-specific flags apply only when compiling for WASM.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
